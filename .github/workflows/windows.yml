
name: WINDOWS NGROK V2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/windows.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Windows Server 2022
    runs-on: windows-2022
    timeout-minutes: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System Information
        shell: pwsh
        run: |
          Write-Host "=== WINDOWS SERVER ==="

          Get-ComputerInfo |
            Select-Object WindowsProductName, OsVersion

          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores

          Get-CimInstance Win32_ComputerSystem |
            Select-Object TotalPhysicalMemory

      - name: Check RDP
        shell: pwsh
        run: |
          Write-Host "=== RDP SERVICE ==="

          Get-Service TermService |
            Select-Object Name, Status, StartType

          Get-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections

      - name: Install ngrok
        shell: pwsh
        run: |
          choco install ngrok -y --no-progress
          ngrok version

      - name: Configure ngrok
        shell: pwsh
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace(
            $env:NGROK_AUTHTOKEN
          )) {
            throw "Missing NGROK_AUTHTOKEN"
          }

          ngrok config add-authtoken `
            $env:NGROK_AUTHTOKEN

          Write-Host "ngrok configured"

      - name: Generate Reports
        if: always()
        shell: pwsh
        run: |
          Get-ComputerInfo |
            Out-File windows-info.txt

          Get-Service TermService |
            Out-File rdp-status.txt

          if (Get-Command ngrok -ErrorAction SilentlyContinue) {
            ngrok version |
              Out-File ngrok-version.txt
          } else {
            "ngrok not installed" |
              Out-File ngrok-version.txt
          }

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ngrok-reports
          path: |
            windows-info.txt
            rdp-status.txt
            ngrok-version.txt
