
name: Windows RDP via ngrok

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Configure RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if (-not $env:RDP_PASSWORD) {
            throw "Missing RDP_PASSWORD secret"
          }

          $user = "RDPUser"
          $pass = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          New-LocalUser -Name $user `
            -Password $pass `
            -PasswordNeverExpires

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $user

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

      - name: Install ngrok
        shell: powershell
        run: |
          choco install ngrok -y --no-progress

      - name: Start ngrok TCP
        shell: powershell
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          if (-not $env:NGROK_AUTHTOKEN) {
            throw "Missing NGROK_AUTHTOKEN secret"
          }

          ngrok config add-authtoken $env:NGROK_AUTHTOKEN

          Start-Process ngrok `
            -ArgumentList "tcp 3389" `
            -WindowStyle Hidden

          Start-Sleep -Seconds 12

          try {
            $data = Invoke-RestMethod `
              "http://127.0.0.1:4040/api/tunnels"

            $tcp = $data.tunnels |
              Where-Object { $_.proto -eq "tcp" } |
              Select-Object -First 1

            if (-not $tcp) {
              throw "No TCP tunnel found"
            }

            Write-Host "RDP ADDRESS: $($tcp.public_url)"
            Write-Host "USERNAME: RDPUser"
          }
          catch {
            throw "ngrok TCP failed. Check account verification and TCP eligibility."
          }

      - name: Keep session alive
        shell: powershell
        run: |
          Write-Host "Temporary RDP session running"
          Start-Sleep -Seconds 3000
